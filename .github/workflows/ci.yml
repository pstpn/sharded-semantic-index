name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install the pinned environment
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps
          pip check
      - name: Lint
        run: |
          ruff check sharded_index tests
          ruff format --check sharded_index tests
      - name: Types
        run: mypy
      - name: Tests
        run: pytest
