# Pipeline of the experiment. Stages with `foreach` run once per clustering
# method of params.yaml (`cluster@leiden`, `cluster@cpm`, ...).

stages:
  extract_pairs:
    cmd: python -m sharded_index.pipeline.extract_pairs
    deps:
      - sharded_index/pipeline/extract_pairs.py
      - sharded_index/data/msmarco.py
      - sharded_index/text.py
    params:
      - dataset
    outs:
      - data/processed/pairs.parquet

  build_corpus:
    cmd: python -m sharded_index.pipeline.build_corpus
    deps:
      - sharded_index/pipeline/build_corpus.py
      - sharded_index/data/corpus.py
      - sharded_index/text.py
      - sharded_index/storage.py
      - data/processed/pairs.parquet
    params:
      - text
    outs:
      - data/interim/corpus

  build_index:
    cmd: python -m sharded_index.pipeline.build_index
    deps:
      - sharded_index/pipeline/build_index.py
      - sharded_index/index/build.py
      - sharded_index/text.py
      - data/processed/pairs.parquet
    params:
      - text
    outs:
      # Rebuilt only when the corpus fingerprint changes, so it is kept between runs.
      - data/interim/index:
          cache: false
          persist: true

  build_graph:
    cmd: python -m sharded_index.pipeline.build_graph
    deps:
      - sharded_index/pipeline/build_graph.py
      - sharded_index/data/msmarco.py
      - sharded_index/graph/cooccurrence.py
      - sharded_index/text.py
      - data/processed/pairs.parquet
    params:
      - text
      - graph
      - queries.train_ratio
    outs:
      - models/graph.parquet

  sample_queries:
    cmd: python -m sharded_index.pipeline.sample_queries
    deps:
      - sharded_index/pipeline/sample_queries.py
      - sharded_index/data/msmarco.py
      - sharded_index/data/queries.py
      - sharded_index/text.py
      - data/processed/pairs.parquet
      - models/graph.parquet
    params:
      - queries
    outs:
      - data/interim/queries.parquet

  rank_queries:
    cmd: python -m sharded_index.pipeline.rank_queries
    deps:
      - sharded_index/pipeline/rank_queries.py
      - sharded_index/data/corpus.py
      - sharded_index/index/build.py
      - sharded_index/index/ranking.py
      - sharded_index/storage.py
      - sharded_index/text.py
      - data/interim/queries.parquet
      - data/interim/corpus
      - data/interim/index
    params:
      - bm25
      - evaluation.ranking_depth
      - queries
    outs:
      # Rankings are reused query by query, so the directory is kept between runs.
      - data/interim/rankings:
          cache: false
          persist: true

  cluster:
    foreach: ${clustering.methods}
    do:
      cmd: python -m sharded_index.pipeline.cluster --method ${key}
      deps:
        - sharded_index/pipeline/cluster.py
        - sharded_index/graph/clustering.py
        - models/graph.parquet
      params:
        - clustering.seed
        - clustering.methods.${key}
      outs:
        - models/clusterings/${key}.parquet

  build_partitions:
    foreach: ${clustering.methods}
    do:
      cmd: python -m sharded_index.pipeline.build_partitions --method ${key}
      deps:
        - sharded_index/pipeline/build_partitions.py
        - sharded_index/graph
        - sharded_index/partition
        - sharded_index/data/corpus.py
        - sharded_index/storage.py
        - sharded_index/text.py
        - models/graph.parquet
        - models/clusterings/${key}.parquet
        - data/interim/corpus
      params:
        - partition
        - clustering.seed
        - clustering.methods.${key}
      outs:
        - models/partitions/${key}

  assign_documents:
    foreach: ${clustering.methods}
    do:
      cmd: python -m sharded_index.pipeline.assign_documents --method ${key}
      deps:
        - sharded_index/pipeline/assign_documents.py
        - sharded_index/data/corpus.py
        - sharded_index/evaluation/membership.py
        - sharded_index/partition/model.py
        - sharded_index/storage.py
        - sharded_index/text.py
        - models/partitions/${key}
        - data/interim/corpus
      params:
        - partition.strategies
      outs:
        - data/interim/assignments/${key}

  evaluate:
    foreach: ${clustering.methods}
    do:
      cmd: python -m sharded_index.pipeline.evaluate --method ${key}
      deps:
        - sharded_index/pipeline/evaluate.py
        - sharded_index/graph
        - sharded_index/partition
        - sharded_index/data/corpus.py
        - sharded_index/evaluation/measure.py
        - sharded_index/evaluation/membership.py
        - sharded_index/index/ranking.py
        - sharded_index/routing.py
        - sharded_index/storage.py
        - sharded_index/text.py
        - models/graph.parquet
        - models/clusterings/${key}.parquet
        - models/partitions/${key}
        - data/interim/assignments/${key}
        - data/interim/corpus
        - data/interim/rankings
      params:
        - text
        - routing
        - partition.strategies
        - queries
        - evaluation.top_k
        - evaluation.budgets
      outs:
        - data/interim/evaluation/${key}

  verify:
    foreach: ${clustering.methods}
    do:
      cmd: python -m sharded_index.pipeline.verify --method ${key}
      deps:
        - sharded_index/pipeline/verify.py
        - sharded_index/index
        - sharded_index/data/corpus.py
        - sharded_index/data/queries.py
        - sharded_index/evaluation/measure.py
        - sharded_index/evaluation/membership.py
        - sharded_index/evaluation/verification.py
        - sharded_index/graph/cooccurrence.py
        - sharded_index/partition/model.py
        - sharded_index/routing.py
        - sharded_index/storage.py
        - sharded_index/text.py
        - data/processed/pairs.parquet
        - models/graph.parquet
        - models/partitions/${key}
        - data/interim/assignments/${key}
        - data/interim/corpus
        - data/interim/rankings
        - data/interim/index
      params:
        - text
        - routing
        - bm25
        - partition.strategies
        - queries
        - evaluation.budgets
        - verification
      outs:
        - data/interim/verification/${key}.json

  sensitivity:
    foreach: ${clustering.methods}
    do:
      cmd: python -m sharded_index.pipeline.sensitivity --method ${key}
      deps:
        - sharded_index/pipeline/sensitivity.py
        - sharded_index/graph
        - sharded_index/partition
        - sharded_index/data/corpus.py
        - sharded_index/data/msmarco.py
        - sharded_index/evaluation/measure.py
        - sharded_index/evaluation/membership.py
        - sharded_index/evaluation/statistics.py
        - sharded_index/evaluation/variants.py
        - sharded_index/index/ranking.py
        - sharded_index/routing.py
        - sharded_index/storage.py
        - sharded_index/text.py
        - data/processed/pairs.parquet
        - data/interim/corpus
        - data/interim/rankings
      params:
        - text
        - queries
        - graph
        - partition
        - routing
        - clustering.seed
        - clustering.methods.${key}
        - evaluation.top_k
        - evaluation.budgets
        - sensitivity.sample
        - sensitivity.seeds
        - sensitivity.train_sizes
        - sensitivity.parameters.${key}
      outs:
        - data/interim/sensitivity/${key}.parquet

  ablations:
    foreach: ${clustering.methods}
    do:
      cmd: python -m sharded_index.pipeline.ablations --method ${key}
      deps:
        - sharded_index/pipeline/ablations.py
        - sharded_index/graph
        - sharded_index/partition
        - sharded_index/data/corpus.py
        - sharded_index/data/msmarco.py
        - sharded_index/evaluation/measure.py
        - sharded_index/evaluation/membership.py
        - sharded_index/evaluation/statistics.py
        - sharded_index/evaluation/variants.py
        - sharded_index/index/ranking.py
        - sharded_index/routing.py
        - sharded_index/storage.py
        - sharded_index/text.py
        - data/processed/pairs.parquet
        - data/interim/corpus
        - data/interim/rankings
      params:
        - text
        - queries
        - graph
        - partition
        - routing
        - clustering.seed
        - clustering.methods.${key}
        - evaluation.top_k
        - evaluation.budgets
        - ablations
      outs:
        - data/interim/ablations/${key}.parquet

  report:
    cmd: python -m sharded_index.pipeline.report
    deps:
      - sharded_index/pipeline/report.py
      - sharded_index/data/corpus.py
      - sharded_index/evaluation/measure.py
      - sharded_index/evaluation/membership.py
      - sharded_index/evaluation/slices.py
      - sharded_index/evaluation/statistics.py
      - sharded_index/graph/cooccurrence.py
      - sharded_index/index/ranking.py
      - sharded_index/partition/model.py
      - sharded_index/reporting/tables.py
      - sharded_index/routing.py
      - sharded_index/storage.py
      - sharded_index/text.py
      - models/graph.parquet
      - data/interim/queries.parquet
      - data/interim/evaluation
      - data/interim/verification
      - data/interim/sensitivity
      - data/interim/ablations
    params:
      - text
      - clustering.methods
      - partition.strategies
      - queries
      - evaluation
    outs:
      - metrics/partitions.csv:
          cache: false
      - metrics/routing.csv:
          cache: false
      - metrics/retrieval.csv:
          cache: false
      - metrics/comparisons.csv:
          cache: false
      - metrics/slices.csv:
          cache: false
      - metrics/sensitivity.csv:
          cache: false
      - metrics/ablations.csv:
          cache: false
      - metrics/verification.csv:
          cache: false

  describe:
    cmd: python -m sharded_index.pipeline.describe
    deps:
      - sharded_index/pipeline/describe.py
      - sharded_index/graph
      - sharded_index/data/corpus.py
      - sharded_index/data/msmarco.py
      - sharded_index/evaluation/measure.py
      - sharded_index/evaluation/membership.py
      - sharded_index/evaluation/statistics.py
      - sharded_index/index/ranking.py
      - sharded_index/partition/model.py
      - sharded_index/reporting/describe.py
      - sharded_index/reporting/tables.py
      - sharded_index/routing.py
      - sharded_index/storage.py
      - sharded_index/text.py
      - data/processed/pairs.parquet
      - data/interim/corpus
      - models/graph.parquet
      - models/clusterings
    params:
      - text
      - queries.train_ratio
      - graph.stop_words
      - clustering
      - describe
    outs:
      - metrics/corpus.json:
          cache: false
      - metrics/clusterings.csv:
          cache: false
      - metrics/clusters.csv:
          cache: false
      - metrics/frame_words.csv:
          cache: false

  figures:
    cmd: python -m sharded_index.pipeline.figures
    deps:
      - sharded_index/pipeline/figures.py
      - sharded_index/data/corpus.py
      - sharded_index/evaluation/measure.py
      - sharded_index/evaluation/membership.py
      - sharded_index/graph/cooccurrence.py
      - sharded_index/index/ranking.py
      - sharded_index/partition/model.py
      - sharded_index/reporting/labels.py
      - sharded_index/reporting/overview.py
      - sharded_index/reporting/plots.py
      - sharded_index/reporting/style.py
      - sharded_index/routing.py
      - sharded_index/storage.py
      - sharded_index/text.py
      - models/graph.parquet
      - models/clusterings
      - data/interim/evaluation
      - metrics/partitions.csv
      - metrics/routing.csv
      - metrics/retrieval.csv
      - metrics/comparisons.csv
      - metrics/slices.csv
      - metrics/sensitivity.csv
      - metrics/ablations.csv
    params:
      - queries
      - clustering.methods
      - partition.strategies
      - evaluation.top_k
      - evaluation.budgets
      - figures
    outs:
      - reports/figures:
          cache: false
